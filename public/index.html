<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Sylph AR Tracking</title>

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: transparent !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Completely hide VR / AR enter buttons */
        .a-enter-vr,
        .a-enter-vr-button,
        .a-enter-ar,
        .a-enter-ar-button,
        [aframe-injected].a-enter-vr,
        [aframe-injected].a-enter-ar {
            display: none !important;
            opacity: 0 !important;
            pointer-events: none !important;
            visibility: hidden !important;
        }

        #guideBox {
            position: fixed;
            top: 22px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.72);
            color: #ffffff;
            padding: 10px 22px;
            border-radius: 24px;
            font-size: 13.5px;
            font-weight: 600;
            z-index: 9998;
            pointer-events: none;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            text-align: center;
            white-space: nowrap;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
        }

        #soundToggle {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.65);
            color: #ffffff;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        }

        #soundToggle:active {
            transform: scale(0.92);
        }

        #errorOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(18, 18, 22, 0.95);
            color: white;
            z-index: 10000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            box-sizing: border-box;
        }

        #errorOverlay h2 {
            margin: 0 0 10px 0;
            color: #ff5252;
            font-size: 20px;
        }

        #errorOverlay p {
            color: #bbb;
            max-width: 420px;
            font-size: 14px;
            line-height: 1.5;
            margin: 0;
        }
    </style>
</head>

<body>
    <div id="errorOverlay">
        <h2>Marker / Video Tidak Ditemukan</h2>
        <p>Parameter AR session tidak valid. Silakan scan kembali dari aplikasi Sylph.</p>
    </div>

    <div id="guideBox">📷 Point camera at your photo frame</div>

    <button id="soundToggle" title="Toggle Sound" aria-label="Toggle Sound">
        <svg id="iconMuted" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
        </svg>
        <svg id="iconUnmuted" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
    </button>

    <div id="sceneContainer"></div>

    <script>
        function getParams() {
            const urlParams = new URLSearchParams(window.location.search);
            const hash = window.location.hash || '';

            let rawToken = urlParams.get('token');
            if (!rawToken && hash.includes('token=')) {
                rawToken = hash.split('token=')[1].split('&')[0];
            }

            if (rawToken) {
                try {
                    let base64 = rawToken.replace(/-/g, '+').replace(/_/g, '/');
                    while (base64.length % 4 !== 0) base64 += '=';
                    const json = JSON.parse(decodeURIComponent(escape(atob(base64))));
                    if (json.m && json.v) {
                        return {
                            mindUrl: json.m,
                            videoUrl: json.v,
                            width: parseFloat(json.w) || 1.0,
                            height: parseFloat(json.h) || 1.0
                        };
                    }
                } catch (e) {
                    console.warn("Token decode fallback to query:", e);
                }
            }

            const mindUrl = urlParams.get('mind_url');
            const videoUrl = urlParams.get('video_url');
            const width = parseFloat(urlParams.get('plane_width')) || 1.0;
            const height = parseFloat(urlParams.get('plane_height')) || 1.0;

            if (mindUrl && videoUrl) {
                return { mindUrl, videoUrl, width, height };
            }
            return null;
        }

        const data = getParams();

        if (!data) {
            document.getElementById('errorOverlay').style.display = 'flex';
            document.getElementById('guideBox').style.display = 'none';
            document.getElementById('soundToggle').style.display = 'none';
        } else {
            // Build A-Frame scene dynamically via container.innerHTML
            const container = document.getElementById('sceneContainer');
            container.innerHTML = `
                <a-scene mindar-image="imageTargetSrc: ${data.mindUrl}; autoStart: true;" color-space="sRGB"
                    renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
                    device-orientation-permission-ui="enabled: false">
                    <a-assets>
                        <video id="video" src="${data.videoUrl}" loop crossorigin="anonymous" webkit-playsinline playsinline muted autoplay></video>
                    </a-assets>

                    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

                    <a-entity mindar-image-target="targetIndex: 0" videohandler>
                        <a-plane width="${data.width}" height="${data.height}" position="0 0.18 0" material="shader: flat; src: #video" rotation="0 0 0"></a-plane>
                    </a-entity>
                </a-scene>
            `;

            AFRAME.registerComponent('videohandler', {
                init: function () {
                    const video = document.querySelector("#video");
                    const guideBox = document.querySelector("#guideBox");
                    this.el.addEventListener("targetFound", () => {
                        if (guideBox) guideBox.style.display = "none";
                        if (video) {
                            const playPromise = video.play();
                            if (playPromise !== undefined) {
                                playPromise.catch(error => {
                                    video.muted = true;
                                    video.play();
                                });
                            }
                        }
                    });
                    this.el.addEventListener("targetLost", () => {
                        if (guideBox) guideBox.style.display = "block";
                        if (video) video.pause();
                    });
                }
            });

            // Sound toggle
            const soundToggle = document.querySelector("#soundToggle");
            const iconMuted = document.querySelector("#iconMuted");
            const iconUnmuted = document.querySelector("#iconUnmuted");

            soundToggle.addEventListener("click", () => {
                const video = document.querySelector("#video");
                if (!video) return;
                video.muted = !video.muted;
                if (video.muted) {
                    iconMuted.style.display = "block";
                    iconUnmuted.style.display = "none";
                } else {
                    iconMuted.style.display = "none";
                    iconUnmuted.style.display = "block";
                    video.play().catch(e => console.warn("Audio unlock required:", e));
                }
            });

            // Mobile click fallback to guarantee audio/camera start
            window.addEventListener('load', () => {
                const sceneEl = document.querySelector('a-scene');
                document.body.addEventListener('click', () => {
                    if (sceneEl && sceneEl.components['mindar-image'] && !sceneEl.components['mindar-image'].started) {
                        sceneEl.components['mindar-image'].start();
                    }
                }, { once: true });
            });
        }
    </script>
</body>
</html>
