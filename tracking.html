<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Sylph AR Tracking</title>

    <!-- Stable A-Frame 1.5.0 & MindAR 1.2.5 -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            background: #000000 !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
        }

        /* Ensure A-Frame scene covers the entire mobile viewport */
        a-scene {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 1;
        }

        /* Completely hide VR / AR enter buttons */
        .a-enter-vr,
        .a-enter-vr-button,
        .a-enter-ar,
        .a-enter-ar-button,
        [aframe-injected].a-enter-vr,
        [aframe-injected].a-enter-ar {
            display: none !important;
            opacity: 0 !important;
            pointer-events: none !important;
            visibility: hidden !important;
        }

        /* Top floating guide badge */
        #guideBox {
            position: fixed;
            top: 22px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.72);
            color: #ffffff;
            padding: 10px 22px;
            border-radius: 24px;
            font-size: 13.5px;
            font-weight: 600;
            z-index: 9998;
            pointer-events: none;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            text-align: center;
            white-space: nowrap;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
            transition: opacity 0.3s ease;
        }

        /* Bottom Floating Sound Control */
        #soundToggle {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.65);
            color: #ffffff;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            transition: transform 0.15s ease;
        }

        #soundToggle:active {
            transform: scale(0.92);
        }

        /* Error / Access Overlay */
        #errorOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(18, 18, 22, 0.98);
            color: white;
            z-index: 10000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }

        #errorOverlay h2 {
            margin: 0 0 10px 0;
            color: #ff5252;
            font-size: 20px;
        }

        #errorOverlay p {
            color: #bbb;
            max-width: 420px;
            font-size: 14px;
            line-height: 1.5;
            margin: 0;
        }
    </style>

    <script>
        // Register component BEFORE scene parsing
        AFRAME.registerComponent('videohandler', {
            init: function () {
                const video = document.querySelector("#arVideo");
                const guideBox = document.querySelector("#guideBox");

                this.el.addEventListener("targetFound", () => {
                    console.log("[SylphAR] Target Found! Playing video overlay.");
                    if (guideBox) guideBox.style.opacity = "0";
                    if (video) {
                        const playPromise = video.play();
                        if (playPromise !== undefined) {
                            playPromise.catch(error => {
                                console.warn("[SylphAR] Video autoplay muted fallback:", error);
                                video.muted = true;
                                video.play();
                            });
                        }
                    }
                });

                this.el.addEventListener("targetLost", () => {
                    console.log("[SylphAR] Target Lost.");
                    if (guideBox) guideBox.style.opacity = "1";
                    if (video) video.pause();
                });
            }
        });
    </script>
</head>

<body>
    <div id="errorOverlay">
        <h2>Marker / Video Tidak Ditemukan</h2>
        <p>Parameter sesi AR tidak valid atau telah kedaluwarsa. Silakan scan kembali dari aplikasi Sylph.</p>
    </div>

    <div id="guideBox">📷 Point camera at your photo frame</div>

    <button id="soundToggle" title="Toggle Sound" aria-label="Toggle Sound">
        <svg id="iconMuted" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
        </svg>
        <svg id="iconUnmuted" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
    </button>

    <script>
        function getParams() {
            const urlParams = new URLSearchParams(window.location.search);
            const hash = window.location.hash || '';

            let rawToken = urlParams.get('token');
            if (!rawToken && hash.includes('token=')) {
                rawToken = hash.split('token=')[1].split('&')[0];
            }

            if (rawToken) {
                try {
                    let base64 = rawToken.replace(/-/g, '+').replace(/_/g, '/');
                    while (base64.length % 4 !== 0) base64 += '=';
                    const json = JSON.parse(decodeURIComponent(escape(atob(base64))));
                    if (json.m && json.v) {
                        return {
                            mindUrl: json.m,
                            videoUrl: json.v,
                            width: parseFloat(json.w) || 1.0,
                            height: parseFloat(json.h) || 1.0
                        };
                    }
                } catch (e) {
                    console.warn("Token decode fallback to query:", e);
                }
            }

            const mindUrl = urlParams.get('mind_url');
            const videoUrl = urlParams.get('video_url');
            const width = parseFloat(urlParams.get('plane_width')) || 1.0;
            const height = parseFloat(urlParams.get('plane_height')) || 1.0;

            if (mindUrl && videoUrl) {
                return { mindUrl, videoUrl, width, height };
            }
            return null;
        }

        const data = getParams();

        if (!data) {
            document.getElementById('errorOverlay').style.display = 'flex';
            document.getElementById('guideBox').style.display = 'none';
            document.getElementById('soundToggle').style.display = 'none';
        } else {
            // 1. Create hidden video overlay outside a-assets to prevent blocking asset loading
            const videoEl = document.createElement('video');
            videoEl.id = 'arVideo';
            videoEl.src = data.videoUrl;
            videoEl.loop = true;
            videoEl.crossOrigin = 'anonymous';
            videoEl.setAttribute('webkit-playsinline', '');
            videoEl.setAttribute('playsinline', '');
            videoEl.muted = true;
            videoEl.style.display = 'none';
            document.body.appendChild(videoEl);

            // 2. Create A-Frame scene directly under document.body (NO zero-height container)
            const sceneEl = document.createElement('a-scene');
            sceneEl.setAttribute('mindar-image', `imageTargetSrc: ${data.mindUrl}; autoStart: true; uiLoading: no; uiScanning: yes;`);
            sceneEl.setAttribute('color-space', 'sRGB');
            sceneEl.setAttribute('renderer', 'colorManagement: true, physicallyCorrectLights, alpha: true');
            sceneEl.setAttribute('vr-mode-ui', 'enabled: false');
            sceneEl.setAttribute('device-orientation-permission-ui', 'enabled: false');

            sceneEl.innerHTML = `
                <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
                <a-entity mindar-image-target="targetIndex: 0" videohandler>
                    <a-plane width="${data.width}" height="${data.height}" position="0 0.18 0" material="shader: flat; src: #arVideo" rotation="0 0 0"></a-plane>
                </a-entity>
            `;

            document.body.appendChild(sceneEl);

            // 3. Sound toggle button
            const soundToggle = document.querySelector("#soundToggle");
            const iconMuted = document.querySelector("#iconMuted");
            const iconUnmuted = document.querySelector("#iconUnmuted");

            soundToggle.addEventListener("click", () => {
                const video = document.querySelector("#arVideo");
                if (!video) return;
                video.muted = !video.muted;
                if (video.muted) {
                    iconMuted.style.display = "block";
                    iconUnmuted.style.display = "none";
                } else {
                    iconMuted.style.display = "none";
                    iconUnmuted.style.display = "block";
                    video.play().catch(e => console.warn("Audio unlock required:", e));
                }
            });

            // 4. Mobile touch trigger to unlock audio/AR if browser requires user gesture
            document.body.addEventListener('click', () => {
                if (videoEl && videoEl.paused && !videoEl.muted) {
                    videoEl.play().catch(() => {});
                }
            }, { once: true });
        }
    </script>
</body>
</html>
